<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн игра Пираты</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #3d0e0e;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #5a1a1a;
        }

        .header h1 {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }

        /* Блок с главной картинкой */
        .image-wrapper {
            padding: 10px;
            text-align: center;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            border: 1px solid #444;
            display: block;
        }

        .caption {
            color: #4da6ff;
            font-size: 14px;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .caption span {
            font-size: 16px;
        }

        /* Кнопка "Начать игру" */
        .start-btn-container {
            text-align: center;
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .pirate-btn-img {
            width: 100%;
            max-width: 300px; /* Размер кнопки */
            height: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); 
        }

        .pirate-btn-img:active {
            transform: scale(0.95);
        }

        /* Описание */
        .description {
            text-align: center;
            color: #ff3333;
            font-size: 14px;
            padding: 0 20px 20px 20px;
            line-height: 1.4;
        }

        /* Ссылки */
        .footer-links {
            border-top: 1px solid #333;
            padding: 0;
        }

        .footer-link {
            display: block;
            padding: 10px 15px;
            color: #ff8c00;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-link:hover {
            background-color: #222;
        }

        /* Футер */
        .version-info {
            text-align: center;
            font-size: 11px;
            color: #666;
            padding: 15px;
            line-height: 1.6;
        }

        .version-info a {
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Заголовок -->
        <div class="header">
            <h1>Онлайн игра Пираты</h1>
        </div>

        <!-- ГЛАВНАЯ КАРТИНКА -->
        <div class="image-wrapper">
            <img src="piratgo_logox.jpg" alt="Пираты">
            <div class="caption">
                <span>⚓</span> Стань круче Джека Воробья!
            </div>
        </div>

        <!-- КНОПКА -->
        <div class="start-btn-container">
            <img src="start.png" alt="Начать игру" class="pirate-btn-img">
        </div>

        <!-- Описание -->
        <div class="description">
            Пираты - настоящий пиратский мир для вашего телефона!<br>
            Сражайся, общайся, люби!
        </div>

        <!-- Ссылки -->
        <div class="footer-links">
            <a href="#" class="footer-link">
                <span>⛵</span> Вход в игру
            </a>
            <a href="#" class="footer-link">
                <span>📝</span> Регистрация
            </a>
        </div>

        <!-- Футер -->
        <div class="version-info">
            19:29 # 24<br>
            game-seawar.com @tg:dev_nwstdio, 2026<br>
            # 0.00121 s.
        </div>
    </div>

</body>
</html>
